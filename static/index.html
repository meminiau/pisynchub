<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PiSyncHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --border: #333333;
      --accent: #ff6600;
      --text: #e0e0e0;
      --muted: #888888;
      --danger: #e53935;
    }
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.25rem;
    }
    .brand img {
      width: 28px;
      height: 28px;
    }
    .user-panel {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.9rem;
    }
    button {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    main {
      padding: 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .node-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }
    .node-item:last-child {
      border-bottom: none;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      width: 100%;
      max-width: 360px;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    input {
      width: 100%;
      padding: 0.6rem;
      background: #141414;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #fff;
      box-sizing: border-box;
    }
    .error {
      color: var(--danger);
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="/icon.svg" alt="PiSyncHub Logo">
      <span>PiSyncHub</span>
    </div>
    <div class="user-panel">
      <span id="nav-user"></span>
      <button class="secondary" id="logout-btn" onclick="logout()" style="display:none;">Log Out</button>
    </div>
  </header>

  <main id="app-content">
    <div class="card">
      <h3>Configured Pi-hole Nodes</h3>
      <div id="nodes-list">Loading nodes...</div>
    </div>

    <div class="card">
      <h3>Add Pi-hole Node</h3>
      <div class="form-group">
        <label>Node Name (e.g., Primary Pi-hole)</label>
        <input type="text" id="new-node-name" placeholder="Pi-hole 1">
      </div>
      <div class="form-group">
        <label>Base URL / IP</label>
        <input type="text" id="new-node-url" placeholder="http://192.168.1.5">
      </div>
      <div class="form-group">
        <label>API Key / Web Password</label>
        <input type="password" id="new-node-key">
      </div>
      <button onclick="addNode()">Add Node</button>
    </div>
  </main>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2 id="modal-title" style="margin-top:0; color:var(--accent);">Admin Setup</h2>
      <p id="modal-desc" style="font-size:0.85rem; color:var(--muted);">Set your admin credentials</p>
      <div id="modal-error" class="error" style="display:none;"></div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" id="auth-username" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="auth-password" autocomplete="current-password">
      </div>
      <div class="form-group" id="confirm-pwd-group">
        <label>Confirm Password</label>
        <input type="password" id="auth-confirm-password" autocomplete="new-password">
      </div>
      <button id="auth-submit-btn" style="width:100%;" onclick="submitAuth()">Submit</button>
    </div>
  </div>

  <script>
    let isSetupMode = false;

    async function checkAuth() {
      const res = await fetch('/api/auth/status');
      const data = await res.json();

      if (data.setup_required) {
        showSetupModal();
      } else if (!data.logged_in) {
        showLoginModal();
      } else {
        document.getElementById('auth-modal').style.display = 'none';
        document.getElementById('nav-user').textContent = data.username;
        document.getElementById('logout-btn').style.display = 'inline-block';
        loadNodes();
      }
    }

    function showSetupModal() {
      isSetupMode = true;
      document.getElementById('auth-modal').style.display = 'flex';
      document.getElementById('modal-title').textContent = 'Admin Setup';
      document.getElementById('modal-desc').textContent = 'Create your administrator account';
      document.getElementById('confirm-pwd-group').style.display = 'block';
      document.getElementById('auth-submit-btn').textContent = 'Complete Setup';
    }

    function showLoginModal() {
      isSetupMode = false;
      document.getElementById('auth-modal').style.display = 'flex';
      document.getElementById('modal-title').textContent = 'PiSyncHub Login';
      document.getElementById('modal-desc').textContent = 'Enter your admin credentials';
      document.getElementById('confirm-pwd-group').style.display = 'none';
      document.getElementById('auth-submit-btn').textContent = 'Log In';
    }

    async function submitAuth() {
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const errBox = document.getElementById('modal-error');
      errBox.style.display = 'none';

      if (isSetupMode) {
        const confirm = document.getElementById('auth-confirm-password').value.trim();
        if (password !== confirm) {
          errBox.textContent = "Passwords do not match";
          errBox.style.display = 'block';
          return;
        }
        const res = await fetch('/api/auth/setup', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, password })
        });
        const result = await res.json();
        if (res.ok) {
          checkAuth();
        } else {
          errBox.textContent = result.message;
          errBox.style.display = 'block';
        }
      } else {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, password })
        });
        const result = await res.json();
        if (res.ok) {
          checkAuth();
        } else {
          errBox.textContent = result.message;
          errBox.style.display = 'block';
        }
      }
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.reload();
    }

    async function loadNodes() {
      const res = await fetch('/api/nodes');
      if (!res.ok) return;
      const data = await res.json();
      const container = document.getElementById('nodes-list');
      if (!data.nodes || data.nodes.length === 0) {
        container.innerHTML = '<p style="color:var(--muted);">No nodes configured yet.</p>';
        return;
      }
      container.innerHTML = data.nodes.map(n => `
        <div class="node-item">
          <div>
            <strong>${n.name}</strong><br>
            <small style="color:var(--muted);">${n.url}</small>
          </div>
        </div>
      `).join('');
    }

    async function addNode() {
      const name = document.getElementById('new-node-name').value.trim();
      const url = document.getElementById('new-node-url').value.trim();
      const api_key = document.getElementById('new-node-key').value.trim();

      if (!name || !url) return alert('Name and URL are required.');

      const res = await fetch('/api/nodes', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name, url, api_key })
      });
      if (res.ok) {
        document.getElementById('new-node-name').value = '';
        document.getElementById('new-node-url').value = '';
        document.getElementById('new-node-key').value = '';
        loadNodes();
      }
    }

    checkAuth();
  </script>
</body>
</html>
