<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiSyncHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <!-- Header & Global Controls -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h1 class="text-3xl font-bold text-emerald-400">PiSyncHub</h1>
            <div class="flex gap-2">
                <button onclick="toggleBlocking('disable', 300)" class="bg-red-500/20 text-red-400 border border-red-500 hover:bg-red-500 hover:text-white px-4 py-2 rounded transition">Pause All (5m)</button>
                <button onclick="toggleBlocking('enable', 0)" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500 hover:bg-emerald-500 hover:text-white px-4 py-2 rounded transition">Enable All</button>
            </div>
        </header>

        <!-- Dynamic Node Grid -->
        <div id="dashboard" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <p class="text-slate-400">Loading nodes...</p>
        </div>
        
        <!-- Node Manager Configuration -->
        <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
            <h2 class="text-xl font-semibold mb-4 text-slate-200">Add Pi-hole Node</h2>
            <form id="addNodeForm" class="flex flex-col md:flex-row gap-4" onsubmit="addNode(event)">
                <input type="text" id="nodeId" placeholder="ID (e.g. pihole1)" class="bg-slate-900 border border-slate-700 p-2 rounded flex-1 outline-none focus:border-emerald-500" required>
                <input type="text" id="nodeName" placeholder="Display Name (Server 1)" class="bg-slate-900 border border-slate-700 p-2 rounded flex-1 outline-none focus:border-emerald-500" required>
                <input type="url" id="nodeUrl" placeholder="URL (http://192.168.X.X)" class="bg-slate-900 border border-slate-700 p-2 rounded flex-1 outline-none focus:border-emerald-500" required>
                <input type="password" id="nodePwd" placeholder="App Password" class="bg-slate-900 border border-slate-700 p-2 rounded flex-1 outline-none focus:border-emerald-500" required>
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded font-medium transition">Save</button>
            </form>
        </div>
    </div>

    <script>
        async function fetchDashboard() {
            const res = await fetch('/api/dashboard');
            const data = await res.json();
            const dash = document.getElementById('dashboard');
            
            if (data.length === 0) {
                dash.innerHTML = '<p class="text-slate-400">No nodes added yet. Add your first Pi-hole below.</p>';
                return;
            }

            dash.innerHTML = data.map(node => `
                <div class="bg-slate-800 p-6 rounded-lg border-l-4 ${node.status === 'online' ? 'border-emerald-500' : 'border-red-500'} shadow-lg">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-xl font-bold">${node.name}</h3>
                        <span class="text-xs font-bold uppercase px-2 py-1 rounded tracking-wider ${node.status === 'online' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">${node.status}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-slate-900 p-3 rounded border border-slate-700">
                            <p class="text-slate-400 text-sm mb-1">Total Queries</p>
                            <p class="text-2xl font-mono">${(node.queries || 0).toLocaleString()}</p>
                        </div>
                        <div class="bg-slate-900 p-3 rounded border border-slate-700">
                            <p class="text-slate-400 text-sm mb-1">Blocked</p>
                            <p class="text-2xl font-mono text-emerald-400">${(node.blocked || 0).toLocaleString()}</p>
                            <p class="text-xs text-slate-500 mt-1">${(node.percent || 0).toFixed(1)}%</p>
                        </div>
                    </div>
                    <div class="flex justify-between items-center border-t border-slate-700 pt-4">
                        <button onclick="backupNode('${node.id}')" class="text-blue-400 hover:text-blue-300 text-sm font-medium flex items-center gap-1 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                            Save Backup
                        </button>
                        <button onclick="deleteNode('${node.id}')" class="text-slate-500 hover:text-red-400 text-sm transition">Remove</button>
                    </div>
                </div>
            `).join('');
        }

        async function addNode(e) {
            e.preventDefault();
            const payload = {
                id: document.getElementById('nodeId').value.replace(/\s+/g, '-').toLowerCase(),
                name: document.getElementById('nodeName').value,
                url: document.getElementById('nodeUrl').value.replace(/\/$/, ""),
                password: document.getElementById('nodePwd').value
            };
            await fetch('/api/nodes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            e.target.reset();
            fetchDashboard();
        }

        async function deleteNode(id) {
            if(confirm("Remove this Node?")) {
                await fetch(`/api/nodes/${id}`, { method: 'DELETE' });
                fetchDashboard();
            }
        }

        async function toggleBlocking(action, time) {
            await fetch(`/api/blocking?action=${action}&time=${time}`, { method: 'POST' });
            setTimeout(fetchDashboard, 1500);
        }

        async function backupNode(id) {
            alert('Triggering background backup... Archive will be saved to your /config/backups folder.');
            await fetch(`/api/backup/${id}`);
        }

        setInterval(fetchDashboard, 10000);
        fetchDashboard();
    </script>
</body>
</html>
